# Publishes web/ (the fixed and original model, running in the browser) to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# GitHub Pages is free for public repositories; a private repo needs a paid plan.
name: Publish browser model

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # bundle.py reads the original model from the upstream commit in this history.
          fetch-depth: 0
      - name: Bundle the fixed and original model sources
        run: python3 web/bundle.py
      - name: Assemble the site
        run: |
          mkdir _site
          cp web/index.html web/style.css web/app.js web/worker.js web/runner.py web/model.zip _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
